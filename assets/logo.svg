<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- AnthroDeck: a handheld (wide screen, a stick over a square trackpad on each side) with a clay
       spark on the screen. Evokes a Steam Deck and Anthropic's clay palette without using either
       company's marks. Rendered to assets/icons by tools/renderIcons.cjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A53"/>
      <stop offset="1" stop-color="#2F2F35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CC785C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#CC785C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Body -->
  <rect x="56" y="292" width="912" height="440" rx="200" fill="url(#body)"/>
  <rect x="56" y="292" width="912" height="440" rx="200" fill="none" stroke="#5C5C66" stroke-width="8"/>

  <!-- Sticks -->
  <circle cx="186" cy="430" r="66" fill="#17171A"/>
  <circle cx="186" cy="430" r="44" fill="#55555E"/>
  <circle cx="838" cy="430" r="66" fill="#17171A"/>
  <circle cx="838" cy="430" r="44" fill="#55555E"/>

  <!-- Trackpads -->
  <rect x="134" y="544" width="104" height="104" rx="24" fill="#1D1D21" stroke="#55555E" stroke-width="6"/>
  <rect x="786" y="544" width="104" height="104" rx="24" fill="#1D1D21" stroke="#55555E" stroke-width="6"/>

  <!-- Screen -->
  <rect x="294" y="344" width="436" height="336" rx="34" fill="#09090B"/>
  <circle cx="512" cy="512" r="200" fill="url(#glow)"/>

  <!-- Spark -->
  <path d="M512 366 C525 470 554 499 658 512 C554 525 525 554 512 658 C499 554 470 525 366 512 C470 499 499 470 512 366 Z"
        fill="#D9825F"/>
</svg>
