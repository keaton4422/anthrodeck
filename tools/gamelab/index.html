<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AnthroDeck game lab</title>
    <style>
      body { margin: 0; background: #0F0F0F; color: #ECECEC; font-family: system-ui, sans-serif; }
      h1 { font-size: 14px; letter-spacing: .1em; color: #CC785C; padding: 10px 14px; margin: 0; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px 10px; }
      .safe { position:absolute; left:0; right:0; bottom:0; height:96px; background:rgba(204,120,92,0.12); border-top:1px dashed #CC785C; pointer-events:none; }
      .wrap { position: relative; }
      .cell { border: 1px solid #2A2A2A; border-radius: 8px; overflow: hidden; background: #000; }
      .bar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: #161616; font-size: 12px; }
      .name { color: #CC785C; font-weight: 700; }
      .hud { color: #8A8A8A; font-family: monospace; margin-left: auto; }
      canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; }
      .warn { color: #E05252; font-family: monospace; }
    </style>
  </head>
  <body>
    <h1>ANTRODECK GAME LAB — all modes, synthetic telemetry</h1>
    <div class="grid" id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
