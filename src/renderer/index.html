<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.anthropic.com; frame-src anthrodeck-mod:;" />
    <title>AnthroDeck</title>
    <!--
      Boot splash. Deliberately plain HTML + CSS with no JavaScript: the CSP forbids inline scripts,
      and more importantly this has to paint BEFORE the renderer bundle is parsed. On Deck hardware
      a cold start takes long enough that a bare #0F0F0F window is indistinguishable from a hang —
      which is exactly how it read the first time it was launched in Game Mode.

      #boot is removed by index.tsx once React has mounted.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #0F0F0F; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #0F0F0F;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      #boot .logo { width: 132px; height: auto; display: block; }
      #boot .mark {
        font-size: 15px; font-weight: 700; letter-spacing: 0.42em;
        color: #ECECEC; text-indent: 0.42em;
      }
      #boot .bar {
        width: 190px; height: 3px; border-radius: 2px;
        background: rgba(204, 120, 92, 0.16); overflow: hidden;
      }
      /* Indeterminate — there is no real progress to report, so don't imply otherwise. */
      #boot .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 2px;
        background: #CC785C; animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      #boot .status { font-size: 12.5px; color: #6A6A6A; letter-spacing: 0.02em; }
      /* Held back 18s, then revealed. Past that the launch is outside the normal range, and saying
         so beats leaving someone watching an animation wondering whether it is stuck. */
      #boot .slow {
        font-size: 12px; color: #8A8A8A; max-width: 340px; text-align: center; line-height: 1.55;
        opacity: 0; animation: reveal 0.4s ease-out 18s forwards;
      }
      @keyframes reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <!-- Same mark as components/Logo.tsx (inline: it must paint before any JS or asset loads). -->
      <svg class="logo" viewBox="56 322 916 432" aria-hidden="true">
        <path d="M180 330 L844 330 C905 330 944 368 952 430 C962 520 966 610 940 680 C920 732 860 748 812 730 C770 714 742 680 700 668 L324 668 C282 680 254 714 212 730 C164 748 104 732 84 680 C58 610 62 520 72 430 C80 368 119 330 180 330 Z" fill="#F0EEE6"/>
        <rect x="300" y="372" width="424" height="258" rx="16" fill="#D97757"/>
        <circle cx="186" cy="438" r="48" fill="#141413"/><circle cx="186" cy="438" r="24" fill="#F0EEE6"/>
        <circle cx="838" cy="438" r="48" fill="#141413"/><circle cx="838" cy="438" r="24" fill="#F0EEE6"/>
        <rect x="146" y="540" width="84" height="84" rx="14" fill="none" stroke="#141413" stroke-width="14"/>
        <rect x="794" y="540" width="84" height="84" rx="14" fill="none" stroke="#141413" stroke-width="14"/>
      </svg>
      <div class="mark">ANTHRODECK</div>
      <div class="bar"></div>
      <div class="status">Starting the engine</div>
      <div class="slow">
        Taking longer than usual. A first launch from an AppImage unpacks before it starts, so this
        is normal once — but if it stays here much past a minute, something is wrong.
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
