name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the release job can write (it creates the GitHub Release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 20 reached end of life in April 2026. 22 matches the Node inside Electron 37.
          node-version: 22
          # No dependency cache in the release pipeline: a poisoned cache would ship to every Deck.
          package-manager-cache: false

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y rpm fakeroot

      - run: npm ci

      # Never publish a build that doesn't typecheck or pass its tests, on either platform.
      - run: npx tsc --noEmit
      - run: npm test

      - name: Make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anthrodeck-${{ matrix.platform }}
          path: out/make/**/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # electron-updater finds releases by fetching this file; electron-forge's makers don't emit
      # it, which is why in-app updates never worked. Generate it from the artifacts we just built
      # so the Deck can update itself instead of needing a Desktop Mode round trip.
      - name: Generate update manifest
        run: |
          node tools/updateManifest.mjs artifacts "${GITHUB_REF_NAME#v}" artifacts/latest-linux.yml
          cat artifacts/latest-linux.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
